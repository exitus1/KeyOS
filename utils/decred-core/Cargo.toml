# SPDX-License-Identifier: Apache-2.0
#
# decred-core — KeyOS adapter over the shared dcr-rs Decred library.
#
# The hard rule stands: nothing that touches elliptic-curve math or standard
# KDFs is hand-rolled here — and since the dcr-rs extraction, nothing
# Decred-specific is either. dcr-rs carries BLAKE-256, addresses, BIP32
# (dprv/dpub), the tx wire format, sighash, ECDSA signature scripts and the
# airgap CBOR package, all pinned by dcrd reference vectors and the deployed
# KeyOS/Pulse golden bytes. This crate only re-exports it under the
# decred_core:: paths KeyOS apps already use.
#
# Pinned by rev for reproducible builds (same policy as the Keystone port).

[package]
name = "decred-core"
version = "0.2.0"
edition = "2021"
description = "KeyOS adapter over dcr-rs (Decred BIP39/BIP32/P2PKH/SigHashAll/ECDSA)"
license = "Apache-2.0"

[dependencies]
dcr-rs = { git = "https://github.com/jzbz/dcr-rs", rev = "e87d4569883bfd589ffbd95592e5e2a5d0c744fa" }

[dev-dependencies]
foundation-ur = "0.4.0"
hex = "0.4"
